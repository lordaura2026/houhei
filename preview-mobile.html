<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>iPhone 8 预览 · 厚黑</title>
    <style>
        body {
            margin: 0;
            background: #141414;
            display: flex;
            justify-content: center;
            padding: 28px 16px;
            font-family: -apple-system, 'Microsoft YaHei', sans-serif;
        }
        .phone-wrap {
            text-align: center;
        }
        .phone-frame {
            width: 375px;
            height: 667px;
            border-radius: 44px;
            border: 9px solid #2a2a2a;
            overflow: hidden;
            box-shadow:
                0 0 0 2px #0c0c0c,
                0 24px 70px rgba(0, 0, 0, 0.65),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            background: #000;
        }
        .phone-top {
            height: 30px;
            background: #000;
            position: relative;
        }
        .phone-speaker {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 5px;
            border-radius: 3px;
            background: #2a2a2a;
        }
        iframe {
            width: 100%;
            height: calc(100% - 30px);
            border: none;
            display: block;
            background: #0a0a0a;
        }
        .label {
            color: #8a8a8a;
            margin-top: 16px;
            font-size: 13px;
            letter-spacing: 0.05em;
        }
        .label a {
            color: #dc2626;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="phone-wrap">
        <div class="phone-frame">
            <div class="phone-top"><div class="phone-speaker"></div></div>
            <iframe src="/index.html" title="厚黑官网"></iframe>
        </div>
        <div class="label">iPhone 8 · 375 × 667 预览 · 返回桌面版 <a href="/index.html" target="_blank">打开</a></div>
    </div>
</body>
</html>
